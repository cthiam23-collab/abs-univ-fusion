# =============================================================================
# ABS University — Nginx Reverse Proxy (HTTP baseline)
# =============================================================================
# Routes:
#   /          → Next.js app (main website + admin portal)
#   /health    → Next.js health check (liveness)
#   /health/ready → Next.js health check (readiness)
#   /platform/ → FastAPI platform backend
#   ecampus    → ILIAS eCampus (SAML SP → Supabase IdP)
# =============================================================================

events {}

http {
    server_tokens off;

    # ── Security Headers ─────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Upstreams ────────────────────────────────────────────────────────────
    upstream nextjs_upstream {
        server nextjs:3000;
    }

    upstream platform_upstream {
        server platform-api:8000;
    }

    upstream ilias_upstream {
        server ilias:80;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 20m;

        # ── Platform API (FastAPI) ────────────────────────────────────────────
        # All /platform/* requests go to the FastAPI backend
        location /platform/ {
            proxy_pass http://platform_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Platform health check
        location = /platform/health {
            proxy_pass http://platform_upstream/health;
            proxy_set_header Host $host;
        }

        location = /platform/health/ready {
            proxy_pass http://platform_upstream/health/ready;
            proxy_set_header Host $host;
        }

        # ── Next.js App (everything else) ─────────────────────────────────────
        location / {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # Next.js health check (proxied from upstream)
        location = /health {
            proxy_pass http://nextjs_upstream/health;
            proxy_set_header Host $host;
        }

        location = /health/ready {
            proxy_pass http://nextjs_upstream/health/ready;
            proxy_set_header Host $host;
        }

        # ── ILIAS eCampus (SAML SP → Supabase IdP) ───────────────────────────
        # Served on its own domain: ecampus.abs-univ.com
        # Listens on a separate port internally (3100 for ILIAS)
    }

    # ── ILIAS eCampus Server (ecampus.abs-univ.com) ───────────────────────────
    server {
        listen 81;
        server_name ecampus.abs-univ.com www.ecampus.abs-univ.com;

        client_max_body_size 50m;

        location / {
            proxy_pass http://ilias_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;
        }
}
