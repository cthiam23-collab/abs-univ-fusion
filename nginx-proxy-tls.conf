# =============================================================================
# ABS University — Nginx Reverse Proxy (HTTPS + TLS)
# =============================================================================
# Use this config in production after obtaining SSL certificates.
# Certs are managed by Coolify (Let's Encrypt) or certbot manually.
#
# Manual certbot setup:
#   sudo certbot certonly --standalone -d abs-univ.com -d www.abs-univ.com
#   # Then copy certs to /etc/ssl/abs-univ/ and use this config
# =============================================================================

events {}

http {
    server_tokens off;

    # ── Security Headers ─────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Upstreams ────────────────────────────────────────────────────────────
    upstream nextjs_upstream {
        server nextjs:3000;
    }

    upstream platform_upstream {
        server platform-api:8000;
    }

    # ── HTTP → HTTPS redirect ────────────────────────────────────────────────
    server {
        listen 80;
        server_name abs-univ.com www.abs-univ.com;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS server ─────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name abs-univ.com www.abs-univ.com;

        # SSL certificates (Coolify-managed or certbot)
        ssl_certificate     /etc/ssl/abs-univ/fullchain.pem;
        ssl_certificate_key /etc/ssl/abs-univ/privkey.pem;

        # SSL settings
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        client_max_body_size 20m;

        # ── Platform API (FastAPI) ────────────────────────────────────────────
        location /platform/ {
            proxy_pass http://platform_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ── Next.js App (everything else) ─────────────────────────────────────
        location / {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # ── Health checks ─────────────────────────────────────────────────────
        location = /health {
            proxy_pass http://nextjs_upstream/health;
            proxy_set_header Host $host;
        }

        location = /health/ready {
            proxy_pass http://nextjs_upstream/health/ready;
            proxy_set_header Host $host;
        }

        location = /platform/health {
            proxy_pass http://platform_upstream/health;
            proxy_set_header Host $host;
        }

        location = /platform/health/ready {
            proxy_pass http://platform_upstream/health/ready;
            proxy_set_header Host $host;
        }
    }
}
